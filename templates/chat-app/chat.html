{% extends "chat-app/base.html" %}
{% load static %}

{% block title %} Chat {% endblock %}

{% block content %}
    <div class="main-container">
        <div class="content-container">
            <div class="top-section">
                <img src="{% static 'img/logo.png' %}" alt="">
            </div>

            <div class="chat-section">

                <div class="messages-section" id="messages-section"></div>

                <div class="input-section">
                    <form id="input-form">
                        {% csrf_token %}
                        <textarea name="user-input" id="input-area" placeholder="Ask away..." rows="5"></textarea>

                        <div class="btn-wrapper">
                            <button id="clear-btn" type="button" onclick=clearInputArea()>
                                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                                <span>Clear</span>
                            </button>

                            <button id="send-btn" type="submit">
                                <span>Send</span>
                                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z"/></svg>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
{% endblock %}
